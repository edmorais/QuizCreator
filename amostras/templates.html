<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Templates PowerPoint</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #17181b; color: #e9e7e3; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  .page { max-width: 1320px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  .lead { color: #a6a9af; margin: 0 0 26px; max-width: 760px; }
  .group { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #83868d; border-bottom: 1px solid #2d2f35; padding-bottom: 6px; margin: 0 0 20px; }
  .tpl { margin-bottom: 46px; }
  .tpl h2 { font-size: 20px; margin: 0; }
  .tpl h2 span { display: inline-block; min-width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 8px; background: #2d2f35; font-size: 15px; margin-right: 10px; }
  .tpl p { margin: 4px 0 2px; color: #b9bbc0; }
  .tpl .fonts { color: #83868d; font-size: 13px; margin-bottom: 12px; }
  .shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .slide { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; }
  .slide * { box-sizing: border-box; }
  .abs { position: absolute; }
  .slide svg { position: absolute; left: 0; top: 0; }

  /* 1 · Atlântico */
  .a { background: #0b1a29; color: #f3efe6; font-family: "Palatino Linotype", serif; }
  .a .kick { font: 600 27px "Segoe UI", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #e8c98f; }
  .a .sun { position: absolute; border: 2px solid #e8c98f; border-radius: 50%; opacity: .55; }
  .a .rule { position: absolute; height: 1px; background: #38506a; }
  .a .num { color: #e8c98f; font-size: 70px; line-height: 1; }
  .a .opt { position: absolute; width: 500px; border-top: 1px solid #38506a; padding-top: 12px; font-size: 54px; line-height: 1.2; }
  .a .opt i { color: #e8c98f; margin-right: 22px; }
  .a .word { position: absolute; width: 500px; height: 170px; border: 1px solid #4b6783; display: flex; align-items: center; justify-content: center; font-size: 58px; }

  /* 3 · Néon */
  .c { background: #09090f; color: #f2f2f8; font-family: Bahnschrift, sans-serif; font-stretch: 75%; }
  .c .cy { color: #2ee6e6; text-shadow: 0 0 22px #2ee6e6aa; }
  .c .mg { color: #ff3b8f; text-shadow: 0 0 22px #ff3b8faa; }
  .c .opt, .c .word { position: absolute; border: 2px solid #2ee6e6; border-radius: 14px; box-shadow: 0 0 16px #2ee6e677; display: flex; align-items: center; }
  .c .opt { width: 530px; height: 112px; padding-left: 32px; gap: 26px; font-size: 58px; }
  .c .opt b { color: #ff3b8f; font-weight: 600; }
  .c .word { width: 540px; height: 170px; justify-content: center; font-size: 66px; letter-spacing: .03em; text-transform: uppercase; }
  .c .pill { position: absolute; border: 2px solid #ff3b8f; border-radius: 40px; box-shadow: 0 0 14px #ff3b8f77; color: #ff3b8f; font-size: 32px; padding: 6px 26px; }

  /* 7 · Laurissilva */
  .g { background: #0e2119; color: #f2eddf; font-family: Constantia, serif; }
  .g .kick { font: 700 27px Corbel, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a9c86e; }
  .g .num { color: #a9c86e; font-size: 130px; line-height: 1; }
  .g .opt { position: absolute; width: 450px; font-size: 54px; line-height: 1.2; display: flex; gap: 20px; }
  .g .opt b { color: #a9c86e; font-weight: 400; font-style: italic; }
  .g .word { position: absolute; width: 450px; height: 168px; background: #17352a; border-bottom: 3px solid #a9c86e; display: flex; align-items: center; justify-content: center; font-size: 58px; }

  /* 9 · Constelação */
  .i { background: linear-gradient(135deg, #0c0f2e, #1c1449 70%, #2a1a5c); color: #fff; font-family: "Century Gothic", sans-serif; }
  .i .kick { font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: #ffe08a; }
  .i .opt { position: absolute; width: 530px; font-size: 50px; display: flex; align-items: center; gap: 22px; }
  .i .opt b { width: 72px; height: 72px; flex: none; border: 2px solid #ffe08a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #ffe08a; font-weight: 400; }
  .i .word { position: absolute; width: 400px; text-align: center; font-size: 60px; font-weight: 700; }

  /* 11 · Vinil */
  .k { background: #1d1410; color: #f8e9cf; font-family: "Cooper Black", serif; }
  .k .kick { font: 700 27px "Century Gothic", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #e9a820; }
  .k .ring { position: absolute; border-radius: 50%; }
  .k .opt { position: absolute; width: 480px; font-size: 52px; display: flex; align-items: center; gap: 22px; }
  .k .opt b { width: 78px; height: 78px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 400; color: #1d1410; }
  .k .word { position: absolute; width: 500px; height: 170px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 62px; color: #1d1410; }

  /* 13 · Fado */
  .m { background: #0d0a0b; color: #f4ece4; font-family: "Palatino Linotype", serif; }
  .m .kick { font-size: 40px; font-style: italic; color: #e0525f; }
  .m .num { font-size: 76px; line-height: 1; color: #e0525f; font-style: italic; }
  .m .opt { position: absolute; width: 500px; font-size: 54px; line-height: 1.2; border-bottom: 1px solid #4a2a2e; padding-bottom: 10px; }
  .m .opt i { color: #e0525f; margin-right: 22px; }
  .m .word { position: absolute; width: 450px; height: 150px; display: flex; align-items: center; font-size: 72px; font-style: italic; border-bottom: 2px solid #c7273a; }

  /* 14 · Madrugada */
  .n { color: #fbf1e6; font-family: "Palatino Linotype", serif; }
  .n .kick { font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: #f9c9a0; }
  .n .sun { position: absolute; border-radius: 50%; background: #f7c68c; }
  .n .opt { position: absolute; width: 500px; font-size: 54px; line-height: 1.2; text-align: center; }
  .n .opt i { color: #f9c9a0; margin-right: 18px; }
  .n .word { position: absolute; width: 500px; height: 140px; background: #ffffff14; border: 1px solid #ffffff40; border-radius: 70px; display: flex; align-items: center; justify-content: center; font-size: 56px; font-style: italic; }

  /* 15 · Metro */
  .o { background: #121417; color: #f4f5f6; font-family: Bahnschrift, sans-serif; font-weight: 600; }
  .o .kick { font-size: 30px; color: #9aa3ad; font-weight: 400; }
  .o .opt { position: absolute; width: 520px; height: 96px; font-size: 54px; display: flex; align-items: center; gap: 22px; }
  .o .opt b { width: 80px; height: 80px; flex: none; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; }
  .o .stop { position: absolute; width: 270px; text-align: center; font-size: 72px; line-height: 1; }

  /* 19 · Regata */
  .s { background: #0d1e33; color: #f6f2e7; font-family: "Gill Sans MT", sans-serif; }
  .s .kick { font-size: 28px; letter-spacing: .18em; text-transform: uppercase; color: #f2c230; }
  .s .big { font-weight: 700; line-height: 1.05; }
  .s .opt { position: absolute; width: 530px; height: 100px; font-size: 56px; display: flex; align-items: center; gap: 24px; }
  .s .opt svg { position: static; flex: none; }
  .s .word { position: absolute; width: 530px; height: 160px; border-top: 4px solid #f2c230; background: #152c49; display: flex; align-items: center; justify-content: center; font-size: 62px; font-weight: 700; }

  /* 20 · Vitral */
  .t { background: #0c0c10; color: #f5efe2; font-family: "Gill Sans MT", sans-serif; }
  .t .kick { font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: #e8ae3c; }
  .t .big { font-weight: 700; line-height: 1.05; }
  .t .opt { position: absolute; width: 470px; font-size: 56px; }
  .t .opt b { color: #e8ae3c; margin-right: 20px; }
  .t .word { position: absolute; width: 470px; height: 170px; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 700; border: 4px solid #e8ae3c; }

  /* 21 · Esplanada */
  .u { background: #1c1a16; color: #f4ecdc; font-family: "Gill Sans MT", sans-serif; }
  .u .kick { font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: #e6b34a; }
  .u .big { font-weight: 700; line-height: 1.05; }
  .u .opt { position: absolute; width: 1100px; height: 74px; font-size: 54px; display: flex; align-items: baseline; gap: 18px; }
  .u .opt b { color: #e6b34a; width: 56px; }
  .u .dots { flex: 1; border-bottom: 3px dotted #6d6555; transform: translateY(-10px); }
  .u .word { position: absolute; width: 530px; height: 140px; background: #2b2820; border-left: 10px solid #b3312c; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 700; }

  /* 22 · Bauhaus */
  .v { background: #1a1a1a; color: #f3efe4; font-family: "Century Gothic", sans-serif; }
  .v .kick { font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #e8b022; }
  .v .big { font-weight: 700; line-height: 1.05; }
  .v .opt { position: absolute; width: 540px; height: 104px; font-size: 52px; display: flex; align-items: center; gap: 24px; }
  .v .opt svg { position: static; flex: none; }
  .v .word { position: absolute; width: 520px; height: 170px; display: flex; align-items: center; gap: 22px; font-size: 58px; font-weight: 700; }
  .v .word svg { position: static; flex: none; }

  /* 23 · Confetes */
  .w { background: #141318; color: #fff; font-family: "Century Gothic", sans-serif; font-weight: 700; }
  .w .kick { font-size: 28px; letter-spacing: .06em; color: #ffd23c; }
  .w .opt, .w .word { position: absolute; background: #141318; border: 4px solid #fff; display: flex; align-items: center; }
  .w .opt { width: 510px; height: 100px; padding-left: 26px; gap: 22px; font-size: 50px; }
  .w .word { width: 510px; height: 156px; justify-content: center; font-size: 58px; }

  /* 24 · Aurora */
  .x { background: #06121b; color: #f2fbf8; font-family: "Century Gothic", sans-serif; }
  .x .kick { font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: #eafff6; }
  .x .opt { position: absolute; width: 530px; height: 100px; border-radius: 50px; background: #ffffff14; font-size: 50px; display: flex; align-items: center; padding-left: 34px; gap: 22px; }
  .x .opt b { color: #8ff0cb; font-weight: 400; }
  .x .word { position: absolute; width: 530px; height: 160px; border-radius: 80px; background: #ffffff14; display: flex; align-items: center; justify-content: center; font-size: 58px; }
</style>
</head>
<body>
<div class="page">
  <h1>Templates de PowerPoint: amostras</h1>
  <p class="lead">Seis propostas novas com Gill Sans e Century Gothic, e os oito templates já guardados. Cada um mostra a capa, a abertura de ronda, uma pergunta de escolha múltipla e a Guilhotina.</p>
  <div id="list"></div>
</div>

<script>
const OPTS = ['Tu', 'W', 'Tg', 'Ts'];
const WORDS = ['Siso', 'Leite', 'Alho', 'Leão'];
const TITLE = 'Quiz Night', DATE = '6 de novembro de 2026', Q = 'Qual é o símbolo químico do tungsténio?', PROMPT = 'Que palavra liga estas quatro?';
const L = 'ABCD';
const box = (s, css, html = '') => `<div class="abs ${s}" style="${css}">${html}</div>`;
const grid = (cls, tag, items, [x, y, dx, dy], cols = 2, style = () => '') => items.map((t, i) =>
  `<div class="${cls}" style="left:${x + (i % cols) * dx}px;top:${y + Math.floor(i / cols) * dy}px;${style(i)}">${tag ? tag(i) : ''}${t}</div>`).join('');

// Gerador determinístico: as estrelas ficam sempre iguais.
function stars(seed, n) {
  let s = seed;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return `<svg width="1280" height="720">${Array.from({ length: n }, () =>
    `<circle cx="${r() * 1280 | 0}" cy="${r() * 720 | 0}" r="${(0.8 + r() * 1.8).toFixed(1)}" fill="#fff" opacity="${(0.3 + r() * 0.6).toFixed(2)}"/>`).join('')}</svg>`;
}

// Curvas de nível: elipses concêntricas e ligeiramente deslocadas.
function contours(cx, cy, n, color) {
  return `<svg width="1280" height="720">${Array.from({ length: n }, (_, i) => {
    const rx = 90 + i * 62, ry = 60 + i * 50;
    return `<ellipse cx="${cx + i * 7}" cy="${cy - i * 5}" rx="${rx}" ry="${ry}" fill="none" stroke="${color}" stroke-width="1.5" transform="rotate(-18 ${cx} ${cy})"/>`;
  }).join('')}</svg>`;
}

const VINIL = ['#e8622a', '#e9a820', '#d9405e', '#2a9d8f'];
function vinylRings(cx, cy, base, step) {
  return VINIL.map((c, i) => {
    const d = base - i * step;
    return `<div class="ring" style="left:${cx - d / 2}px;top:${cy - d / 2}px;width:${d}px;height:${d}px;background:${c}"></div>`;
  }).join('') + `<div class="ring" style="left:${cx - (base - 4 * step) / 2}px;top:${cy - (base - 4 * step) / 2}px;width:${base - 4 * step}px;height:${base - 4 * step}px;background:#1d1410"></div>`;
}

const A = {
  no: 1, name: 'Atlântico', cls: 'a',
  desc: 'Azul-noite e areia. Sóbrio e editorial, com muito espaço à volta do texto.',
  fonts: 'Palatino Linotype · Segoe UI',
  cover: box('sun', 'width:640px;height:640px;left:800px;top:-80px') + box('sun', 'width:400px;height:400px;left:920px;top:40px')
    + box('kick', 'left:110px;top:230px', DATE) + box('', 'left:104px;top:270px;font-size:150px;line-height:1.1', TITLE)
    + box('rule', 'left:110px;top:470px;width:560px'),
  round: box('', 'right:60px;top:-10px;font-size:640px;line-height:1;color:#12283d', '2')
    + box('kick', 'left:110px;top:270px', 'Ronda 2') + box('', 'left:106px;top:312px;font-size:100px;line-height:1.1', 'Ciências Exatas')
    + box('rule', 'left:110px;top:450px;width:560px'),
  question: box('kick', 'left:110px;top:66px;color:#7fb2ea', 'Ciências Exatas') + box('num', 'right:110px;top:50px', '9')
    + box('', 'left:110px;top:170px;width:1060px;font-size:62px;line-height:1.2', Q)
    + grid('opt', i => `<i>${L[i]}</i>`, OPTS, [110, 410, 560, 120]),
  guil: box('kick', 'left:110px;top:66px;color:#e88fb4', 'Guilhotina') + box('num', 'right:110px;top:50px', '50')
    + box('', 'left:110px;top:150px;font-size:46px;font-style:italic', PROMPT)
    + grid('word', null, WORDS, [110, 270, 560, 190]),
};

const C = {
  no: 3, name: 'Néon', cls: 'c',
  desc: 'Preto com magenta e ciano, como um letreiro de bar. O mais festivo.',
  fonts: 'Bahnschrift Condensed',
  cover: box('mg', 'left:0;right:0;top:130px;text-align:center;font-size:210px;line-height:1;letter-spacing:.06em', 'QUIZ')
    + box('cy', 'left:0;right:0;top:325px;text-align:center;font-size:210px;line-height:1;letter-spacing:.06em', 'NIGHT')
    + box('', 'left:0;right:0;top:565px;text-align:center;font-size:34px;letter-spacing:.14em;color:#b9b9c9;text-transform:uppercase', DATE),
  round: box('mg', 'left:0;right:0;top:200px;text-align:center;font-size:64px;letter-spacing:.2em;text-transform:uppercase', 'Ronda 2')
    + box('cy', 'left:0;right:0;top:300px;text-align:center;font-size:130px;text-transform:uppercase;letter-spacing:.03em', 'Ciências Exatas'),
  question: box('pill', 'left:80px;top:56px', 'PERGUNTA 9') + box('', 'right:84px;top:66px;font-size:32px;letter-spacing:.1em;color:#2ee6e6;text-transform:uppercase', 'Ciências Exatas')
    + box('', 'left:80px;top:160px;width:1120px;font-size:72px;line-height:1.12', Q)
    + grid('opt', i => `<b>${L[i]}</b>`, OPTS, [80, 390, 590, 136]),
  guil: box('pill', 'left:80px;top:56px', 'PERGUNTA 50') + box('', 'right:84px;top:66px;font-size:32px;letter-spacing:.1em;color:#2ee6e6;text-transform:uppercase', 'Guilhotina')
    + box('', 'left:80px;top:150px;font-size:54px', PROMPT)
    + grid('word', null, WORDS, [80, 260, 590, 200]),
};

const G = {
  no: 7, name: 'Laurissilva', cls: 'g',
  desc: 'Verde-floresta e creme, com curvas de nível da serra madeirense. A irmã verde do Atlântico, com letra mais quente.',
  fonts: 'Constantia · Corbel',
  cover: contours(1020, 560, 11, '#2c5240') + box('kick', 'left:110px;top:220px', DATE) + box('', 'left:104px;top:262px;font-size:150px;line-height:1.1', TITLE),
  round: contours(1100, 120, 9, '#2c5240') + box('kick', 'left:110px;top:270px', 'Ronda 2') + box('', 'left:106px;top:312px;font-size:104px;line-height:1.1', 'Ciências Exatas'),
  question: box('num', 'left:90px;top:80px;width:170px;text-align:right', '9')
    + box('kick', 'left:300px;top:90px', 'Ciências Exatas')
    + box('', 'left:300px;top:140px;width:880px;font-size:60px;line-height:1.2', Q)
    + grid('opt', i => `<b>${L[i]}</b>`, OPTS, [300, 420, 470, 110]),
  guil: box('num', 'left:60px;top:80px;width:200px;text-align:right', '50')
    + box('kick', 'left:300px;top:90px', 'Guilhotina')
    + box('', 'left:300px;top:136px;font-size:48px;font-style:italic', PROMPT)
    + grid('word', null, WORDS, [300, 240, 470, 190]),
};

const CONST_LINES = `<svg width="1280" height="720"><g stroke="#ffe08a" stroke-width="1.5" opacity=".6"><line x1="640" y1="440" x2="280" y2="300"/><line x1="640" y1="440" x2="1000" y2="300"/><line x1="640" y1="440" x2="280" y2="590"/><line x1="640" y1="440" x2="1000" y2="590"/></g><circle cx="640" cy="440" r="9" fill="#ffe08a"/></svg>`;
const SKY = `<svg width="1280" height="720"><g stroke="#ffe08a" stroke-width="1.5" opacity=".7" fill="none"><polyline points="760,110 880,190 1010,150 1120,270 1050,390 900,340 880,190"/></g><g fill="#ffe08a"><circle cx="760" cy="110" r="6"/><circle cx="880" cy="190" r="7"/><circle cx="1010" cy="150" r="5"/><circle cx="1120" cy="270" r="7"/><circle cx="1050" cy="390" r="5"/><circle cx="900" cy="340" r="6"/></g></svg>`;

const I = {
  no: 9, name: 'Constelação', cls: 'i',
  desc: 'Céu noturno violeta com estrelas. Na Guilhotina, as quatro palavras ligam-se a um ponto central, como uma constelação.',
  fonts: 'Century Gothic',
  cover: stars(11, 150) + SKY + box('kick', 'left:100px;top:290px', DATE) + box('', 'left:96px;top:330px;font-size:124px;font-weight:700;line-height:1.05', TITLE.replace(' ', '<br>')),
  round: stars(23, 150) + box('kick', 'left:0;right:0;top:270px;text-align:center', 'Ronda 2') + box('', 'left:0;right:0;top:316px;text-align:center;font-size:92px;font-weight:700', 'Ciências Exatas'),
  question: stars(37, 90) + box('kick', 'left:90px;top:60px', 'Ciências Exatas') + box('kick', 'right:90px;top:60px', '9')
    + box('', 'left:90px;top:130px;width:1100px;font-size:56px;font-weight:700;line-height:1.2', Q)
    + grid('opt', i => `<b>${L[i]}</b>`, OPTS, [90, 390, 570, 120]),
  guil: stars(41, 90) + CONST_LINES + box('kick', 'left:90px;top:60px', 'Guilhotina') + box('kick', 'right:90px;top:60px', '50')
    + box('', 'left:0;right:0;top:120px;text-align:center;font-size:44px', PROMPT)
    + [[80, 250], [800, 250], [80, 540], [800, 540]].map(([x, y], i) => `<div class="word" style="left:${x}px;top:${y}px">${WORDS[i]}</div>`).join(''),
};

const K = {
  no: 11, name: 'Vinil', cls: 'k',
  desc: 'Anos 70: faixas curvas de laranja, mostarda, coral e turquesa, com a letra redonda dos cartazes da época. Quente e divertido.',
  fonts: 'Cooper Black · Century Gothic',
  cover: vinylRings(1130, 640, 1000, 120) + box('', 'left:90px;top:130px;font-size:170px;line-height:1', 'Quiz<br>Night') + box('kick', 'left:96px;top:490px', DATE),
  round: vinylRings(1180, 100, 760, 90) + box('kick', 'left:90px;top:270px', 'Ronda 2') + box('', 'left:86px;top:312px;font-size:96px;line-height:1.1', 'Ciências Exatas'),
  question: vinylRings(1240, 40, 320, 40) + box('kick', 'left:90px;top:60px', '9 · Ciências Exatas')

// Vitral: triângulos de cor separados por "chumbo" escuro.
function glass(x0, w, seed) {
  const COLORS = ['#b3202f', '#1f4fa8', '#d9921a', '#1c7a55', '#5b2c8a', '#1f4fa8', '#b3202f'];
  let s = seed;
  const pick = () => COLORS[(s = (s * 16807) % 2147483647) % COLORS.length];
  const size = 120;
  const cells = [];
  for (let y = 0; y < 720; y += size) for (let x = x0; x < x0 + w; x += size) {
    const up = (x + y) % (size * 2) === 0;
    const pts = up
      ? [[[x, y], [x + size, y], [x, y + size]], [[x + size, y], [x + size, y + size], [x, y + size]]]
      : [[[x, y], [x + size, y], [x + size, y + size]], [[x, y], [x + size, y + size], [x, y + size]]];
    pts.forEach(p => cells.push(`<polygon points="${p.map(q => q.join(',')).join(' ')}" fill="${pick()}" stroke="#0c0c10" stroke-width="6"/>`));
  }
  return `<svg width="1280" height="720">${cells.join('')}</svg>`;
}

  f.firstElementChild.style.transform = `scale(${f.clientWidth / 1280})`;
});
new ResizeObserver(fit).observe(document.body);
fit();
</script>
</body>
</html>
